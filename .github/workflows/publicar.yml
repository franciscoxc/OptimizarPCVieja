name: Publicar OptimizarPC

# Publica OptimizarPC.bat como asset de la release "ultima", para descarga
# directa. El link del README usa releases/latest/download/OptimizarPC.bat, que
# no cambia entre versiones.
on:
  push:
    paths:
      - OptimizarPC.bat
      - pruebas/menu.py
      - pruebas/secciones.py
      - pruebas/limpieza.ps1
      - pruebas/sintaxis.ps1
      - .github/workflows/publicar.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Toda la historia: el numero de version se cuenta con git.
          fetch-depth: 0

      # Antes de publicar: si el menu del .bat y la tabla del README no dicen lo
      # mismo, la release no se toca y queda la anterior.
      - name: Comprobar el menu
        run: python3 pruebas/menu.py

      - name: Comprobar las secciones de PowerShell
        run: python3 pruebas/secciones.py

      - name: Probar la limpieza
        run: pwsh -NoProfile pruebas/limpieza.ps1

      - name: Comprobar la sintaxis de PowerShell
        run: pwsh -NoProfile pruebas/sintaxis.ps1

      # La version es la cantidad de commits que tocaron el .bat, con la fecha del
      # ultimo: la lleva git, no una mano, asi no se desincroniza. Se estampa solo
      # en el archivo publicado; el del repositorio dice "local".
      - name: Numerar la version
        run: |
          N=$(git rev-list --count HEAD -- OptimizarPC.bat)
          F=$(git log -1 --format=%cd --date=format:%d/%m/%Y -- OptimizarPC.bat)
          sed -i "s|^set \"OPT_VERSION=local\"|set \"OPT_VERSION=$N ($F)\"|" OptimizarPC.bat
          grep -q "^set \"OPT_VERSION=$N ($F)\"" OptimizarPC.bat
          echo "VERSION=$N ($F)" >> "$GITHUB_ENV"

      - name: Publicar como ultima version
        env:
          GH_TOKEN: ${{ github.token }}
        # Se reemplaza el archivo sin borrar la release: borrar primero dejaba la
        # descarga en 404 si la creacion fallaba. Crear queda para la primera vez.
        run: |
          gh release upload ultima OptimizarPC.bat --clobber || gh release create ultima OptimizarPC.bat \
            --target "$GITHUB_SHA" \
            --notes "Descarga OptimizarPC.bat y ejecutalo con doble clic." \
            --latest
          gh release edit ultima --title "OptimizarPC, version $VERSION"
