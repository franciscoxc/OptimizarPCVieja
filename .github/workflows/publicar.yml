name: Publicar OptimizarPC.zip

# Arma un ZIP con OptimizarPC.bat suelto, sin carpeta, y lo publica como la
# ultima version. Asi el boton del README baja siempre "OptimizarPC.zip".
on:
  push:
    paths:
      - OptimizarPC.bat
      - .github/workflows/publicar.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar el ZIP
        run: zip -j -X OptimizarPC.zip OptimizarPC.bat

      - name: Publicar como ultima version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --cleanup-tag --yes || true
          gh release create ultima OptimizarPC.zip \
            --target "$GITHUB_SHA" \
            --title "OptimizarPC (ultima version)" \
            --notes "Baja OptimizarPC.zip, descomprimilo y hace doble clic en OptimizarPC.bat." \
            --latest
