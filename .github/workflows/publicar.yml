name: Publicar OptimizarPC

# Publica OptimizarPC.bat (descarga directa) y OptimizarPC.zip (el .bat solo,
# sin carpeta) como assets de la release "ultima". Los links del README usan
# releases/latest/download/<archivo>, que no cambian entre versiones.
on:
  push:
    paths:
      - OptimizarPC.bat
      - .github/workflows/publicar.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar el ZIP
        run: zip -j -X OptimizarPC.zip OptimizarPC.bat

      - name: Publicar como ultima version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --cleanup-tag --yes || true
          gh release create ultima OptimizarPC.bat OptimizarPC.zip \
            --target "$GITHUB_SHA" \
            --title "OptimizarPC (ultima version)" \
            --notes "OptimizarPC.bat: descarga directa. OptimizarPC.zip: el mismo .bat comprimido." \
            --latest
