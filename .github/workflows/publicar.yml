name: Publicar OptimizarPC

# Publica OptimizarPC.bat como asset de la release "ultima", para descarga
# directa. El link del README usa releases/latest/download/OptimizarPC.bat, que
# no cambia entre versiones.
on:
  push:
    paths:
      - OptimizarPC.bat
      - .github/workflows/publicar.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar como ultima version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --cleanup-tag --yes || true
          gh release create ultima OptimizarPC.bat \
            --target "$GITHUB_SHA" \
            --title "OptimizarPC (ultima version)" \
            --notes "Descarga OptimizarPC.bat y ejecutalo con doble clic." \
            --latest
